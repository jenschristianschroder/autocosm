name: ci

# Two jobs and one gate.
#
# `verify` runs on every push and pull request and must pass before anything is published.
# `deploy` runs only on `main`, only when the repository has been configured with the Azure
# federation variables, and authenticates with GitHub OIDC. There is no publish profile, no
# service-principal password and no long-lived Azure secret anywhere in this file — see
# docs/security.md for the federated-credential setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` fails if package-lock.json and package.json disagree, which is the
      # reproducibility gate.
      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Installed before the test run because the `infra` Vitest project compiles the Bicep it
      # asserts on. No Azure subscription or login is involved — `az bicep build` is offline.
      - name: Install Bicep
        run: az bicep install

      - name: Unit and integration tests
        run: npm run test

      # Fails on a storage key, connection string, SAS token, PEM key, or inline API key in any
      # file git would track. Runs before the build so a leak cannot be published.
      - name: Secret scan
        run: npm run scan:secrets

      - name: Build browser client
        run: npm run build --workspace @autocosm/web-client

      # Recompiles every template and re-runs the security-policy assertions against the generated
      # ARM JSON. This is where "storage is private" stops being a comment and becomes a test.
      - name: Bicep build and policy assertions
        run: npm run infra:build

      - name: Browser smoke test
        run: |
          npm run test:browser:install
          npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # Deployment. Split into foundation → image → app so there is no circular dependency between
  # the registry that holds the image and the Container Apps that pull it.
  # ---------------------------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write # required for OIDC federation with Azure
    steps:
      - uses: actions/checkout@v4

      # Everything below is skipped rather than failed when the repository has not been wired to
      # an Azure subscription, so a fork or a fresh clone still gets a green build.
      - name: Check Azure configuration
        id: gate
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] && [ -n "$RESOURCE_GROUP" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure deployment variables are not set; skipping deployment."
          fi

      - name: Azure login (OIDC)
        if: steps.gate.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Foundation: VNet, private endpoint, private DNS, Storage, ACR, Log Analytics, the
      # Container Apps environment and the three managed identities with their role assignments.
      - name: Deploy foundation
        if: steps.gate.outputs.configured == 'true'
        id: foundation
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "autocosm-foundation-${{ github.run_number }}" \
            --template-file infra/foundation.bicep \
            --parameters \
              namePrefix="${{ vars.AUTOCOSM_NAME_PREFIX || 'autocosm' }}" \
              azureOpenAiAccountName="${{ vars.AZURE_OPENAI_ACCOUNT_NAME }}" \
            --query properties.outputs -o json > foundation-outputs.json
          echo "registry=$(jq -r '.registryLoginServer.value' foundation-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.gate.outputs.configured == 'true'
        env:
          REGISTRY: ${{ steps.foundation.outputs.registry }}
        run: |
          # ACR build keeps the image inside the boundary and avoids giving the workflow identity
          # its own registry push credentials.
          az acr build \
            --registry "${REGISTRY%%.*}" \
            --image "autocosm:${{ github.sha }}" \
            --image "autocosm:latest" \
            --file Dockerfile .

      # App: the Container App and the two Jobs, pointed at the image just pushed.
      - name: Deploy applications
        if: steps.gate.outputs.configured == 'true'
        id: app
        env:
          REGISTRY: ${{ steps.foundation.outputs.registry }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "autocosm-app-${{ github.run_number }}" \
            --template-file infra/app.bicep \
            --parameters \
              namePrefix="${{ vars.AUTOCOSM_NAME_PREFIX || 'autocosm' }}" \
              containerImage="${REGISTRY}/autocosm:${{ github.sha }}" \
              decisionProvider="${{ vars.AUTOCOSM_DECISION_PROVIDER || 'heuristic' }}" \
              azureOpenAiEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              azureOpenAiDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
              logModelIo="${{ vars.AUTOCOSM_LOG_OPENAI_IO || 'false' }}" \
            --query properties.outputs -o json > app-outputs.json
          echo "fqdn=$(jq -r '.webFqdn.value' app-outputs.json)" >> "$GITHUB_OUTPUT"

      # A read-only smoke test. It never mutates world state, so a failure cannot leave the world
      # in a partial condition.
      #
      # Liveness alone is not enough. /health and /readiness answer without deserialising a single
      # organism or agent, so a schema change that makes stored records unreadable leaves them
      # green while every real route returns 500. The state probes below therefore exercise routes
      # that actually load and parse persisted records, which is what turns a record-migration bug
      # into a failed deploy instead of a silent outage.
      - name: Smoke test
        if: steps.gate.outputs.configured == 'true'
        env:
          FQDN: ${{ steps.app.outputs.fqdn }}
        run: |
          set -euo pipefail

          probe() {
            curl -sS -o "$2" -w '%{http_code}' "https://${FQDN}$1" || echo 000
          }

          ready=false
          for attempt in $(seq 1 20); do
            code=$(probe /api/v1/health /tmp/health.json)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.json)"
              ready=true
              break
            fi
            echo "attempt ${attempt}: http ${code} (cold start can take a while with minReplicas 0)"
            sleep 15
          done

          if [ "$ready" != "true" ]; then
            echo "::error::world-web did not become healthy"
            exit 1
          fi

          # Each of these deserialises persisted world records, unlike /health.
          for route in /api/v1/readiness /api/v1/world /api/v1/snapshot; do
            code=000
            for attempt in $(seq 1 4); do
              code=$(probe "$route" /tmp/probe.json)
              if [ "$code" = "200" ]; then
                break
              fi
              echo "attempt ${attempt}: ${route} returned http ${code}"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::${route} returned http ${code} — deployed code cannot read stored world state"
              head -c 400 /tmp/probe.json || true
              exit 1
            fi
            echo "${route}: 200"
            head -c 200 /tmp/probe.json; echo
          done
